name: Github CI
on:
  # Executa o pipeline (build + testes) a cada push ou pull request na branch main
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest # Os comandos serao executados em Linux

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4 # Faz o checkout do codigo recebido

      - name: Set up JDK 8
        uses: actions/setup-java@v4 # Configura o Java 8
        with:
          distribution: temurin
          java-version: '8'

      - name: Build
        run: mvn package -Dmaven.test.skip=true # Compila o codigo fonte

      - name: Unit Test
        run: mvn test # Executa os testes de unidade
